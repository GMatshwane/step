name: Android Play Store Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Validate required secrets
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN GitHub secret"
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON GitHub secret"
            exit 1
          fi

      - name: Prepare Play service account key
        run: |
          mkdir -p .secrets
          printf "%s" "$GOOGLE_SERVICE_ACCOUNT_JSON" > .secrets/google-service-account.json

      - name: Build Android app bundle (AAB)
        run: eas build --platform android --profile production --non-interactive

      - name: Submit latest Android build to Play internal track
        run: eas submit --platform android --profile production --latest --key .secrets/google-service-account.json --non-interactive
